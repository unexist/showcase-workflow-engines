profiles:
    development:
        data:
            todo_host: http://localhost:8080
            dapr_host: http://localhost:3500

requests:
    api:
        requests:
            create:
                method: POST
                url: "{{todo_host}}/api/todos"
                body:
                    type: json
                    data:
                        description: string
                        done: true
                        title: string

            list:
                method: GET
                url: "{{todo_host}}/api/todos"

    state:
        requests:
            client:
                requests:
                    client_store:
                        name: store
                        method: POST
                        url: "{{todo_host}}/api/state"
                        body:
                            type: json
                            data:
                                description: string
                                done: true
                                title: string

                    client_retrieve:
                        name: retrieve
                        method: GET
                        url: "{{todo_host}}/api/state"
                        headers:
                            accept: application/json

                    client_delete:
                        name: delete
                        method: DELETE
                        url: "{{todo_host}}/api/state"
                        headers:
                            accept: application/json

            direct:
                requests:
                    store_direct:
                        name: store
                        method: POST
                        url: "{{dapr_host}}/v1.0/state/statestore"
                        body:
                            type: json
                            data:
                                key: name
                                value: "Bruce Wayne"

                    retrieve_direct:
                        name: retrieve
                        method: GET
                        url: "{{dapr_host}}/v1.0/state/statestore/name"
                        headers:
                            accept: application/json

    workflow:
        requests:
            schedule:
                method: POST
                url: "{{todo_host}}/api/workflow"
                body:
                    type: json
                    data:
                        description: string
                        done: true
                        title: string

            metdata:
                method: GET
                url: "{{todo_host}}/api/workflow/{{ response('metadata') | jsonpath('$[id].id') }}"

            purge:
                method: DELETE
                url: "{{todo_host}}/api/workflow/{{ response('schedule') | jsonpath('$[id].id') }}"
                body:
                    type: json
                    data:
                        description: string
                        done: true
                        title: string
